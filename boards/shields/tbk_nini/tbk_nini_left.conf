# Central side battery reporting.
# PROXY + FETCHING make the central fetch the peripheral's battery level and
# re-advertise it to the host. These are central-only and OFF by default.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
